[project]
name = "talentmatch-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "httpx>=0.27",
]

[tool.fastapi]
entrypoint = "main:app"
